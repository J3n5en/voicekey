[package]
name = "voicekey-core"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
audiopus_sys = { version = "0.2", features = ["static"] }
cpal = "0.15"
rubato = "0.16"
hound = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
# rustls-tls-native-roots：Jev 额外信任操作系统根证书（含用户手动装进钥匙串的根），
# 否则内网自签 CA 的端点在 rustls 默认的 webpki 根列表下永远 UnknownIssuer
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
aes = "0.8"
ecb = { version = "0.1", features = ["alloc"] }
cbc = { version = "0.1", features = ["alloc"] }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
rsa = { version = "0.9", features = ["sha2"] }
hex = "0.4"
dirs = "5"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
bytes = "1"

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = "0.2"

# iOS：Jev 从 Security.framework 取系统锚点（桌面走 rustls-native-certs）
[target.'cfg(target_os = "ios")'.dependencies]
security-framework = "3"
core-foundation = "0.10"

[[bin]]
name = "vk-test"
path = "src/bin/vk-test.rs"
