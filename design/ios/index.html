<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>VoiceKey iOS 设计稿</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --g1:#22c3ff;--g2:#7b5cff;--g3:#ff3d8b;--grad:linear-gradient(90deg,var(--g1),var(--g2) 55%,var(--g3));
  --accent:#6a5cff;--ok:#1fb57a;--warn:#f0a020;--err:#ef4a5a;--rec:#ff3b30;
  --bg:#e6e9f2;--scr:#f2f2f7;--card:#fff;--kb:#d3d6dd;--key:#fff;--key2:#adb2bc;--keyfg:#111;
  --line:rgba(20,20,40,.1);--fg:#16161f;--fg2:#5c5f6e;--fg3:#9a9cab;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;
}
.dark{--bg:#0b0c14;--scr:#000;--card:#1c1c1e;--kb:#2c2c30;--key:#5b5b60;--key2:#3c3c41;--keyfg:#fff;
  --line:rgba(255,255,255,.1);--fg:#f2f2f7;--fg2:#a3a5b5;--fg3:#6c6e80;--accent:#8b80ff}
*{box-sizing:border-box;margin:0;padding:0}
body{font:13px/1.5 var(--font);color:var(--fg);background:var(--bg);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}

/* 设计稿工具条（不属于产品界面） */
.toolbar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:8px 18px;background:rgba(10,10,20,.93);color:#ccc;font-size:12px}
.toolbar b{color:#fff;font-size:13px}
.toolbar .g{display:flex;gap:4px;align-items:center}
.toolbar .g>span{color:#888;margin-right:2px;white-space:nowrap}
.toolbar button{border:0;background:rgba(255,255,255,.09);color:#ddd;padding:4px 10px;border-radius:6px;white-space:nowrap}
.toolbar button.on{background:#fff;color:#111}
.toolbar button:hover{background:rgba(255,255,255,.18)}.toolbar button.on:hover{background:#fff}

.wrap{display:flex;gap:28px;justify-content:center;align-items:flex-start;padding:22px 18px 40px}

/* 手机外壳 */
.phone{width:390px;height:844px;border-radius:56px;background:#111;padding:11px;flex:none;box-shadow:0 30px 70px rgba(20,20,50,.3)}
.screen{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;background:var(--scr);color:var(--fg);display:flex;flex-direction:column}
.sb{height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 26px 0 30px;font-size:15px;font-weight:600;position:relative;z-index:5}
.sb .l{min-width:70px;display:flex;align-items:center;gap:4px}
.crumb{font-size:12px;font-weight:500;color:var(--accent);border:0;background:none;padding:2px 0}
.island{position:absolute;left:50%;top:11px;transform:translateX(-50%);height:34px;min-width:122px;border-radius:20px;background:#000;display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:8px;color:#fff;font-size:11px;font-weight:600;transition:min-width .3s}
.island.live{min-width:200px}
.island .vk{display:flex;align-items:center;gap:5px}
.island .vk i{width:8px;height:8px;border-radius:50%;background:var(--g2);box-shadow:0 0 6px var(--g2)}
.island .vk.rec i{background:var(--rec);box-shadow:0 0 6px var(--rec);animation:pulse 1s infinite}
.sb .r{display:flex;gap:5px;align-items:center;font-size:12px}
.odot{width:7px;height:7px;border-radius:50%;background:#ff9f0a;display:inline-block}
.batt{width:24px;height:12px;border:1.5px solid currentColor;border-radius:4px;position:relative;opacity:.9}
.batt:after{content:"";position:absolute;inset:1.5px;right:5px;background:currentColor;border-radius:1.5px}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--fg);opacity:.85;z-index:9}
.body{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;overflow:auto;padding:4px 18px 30px}

/* 通用 iOS 组件 */
.lt{font-size:30px;font-weight:700;margin:6px 0 12px}
.sec{font-size:12px;color:var(--fg3);margin:18px 6px 6px;text-transform:uppercase}
.grp{background:var(--card);border-radius:12px;overflow:hidden}
.cell{display:flex;align-items:center;gap:10px;padding:11px 14px;min-height:46px;font-size:15px}
.cell+.cell{border-top:.5px solid var(--line)}
.cell .t{flex:1;min-width:0}.cell .t small{display:block;font-size:12px;color:var(--fg3);line-height:1.35}
.cell .v{color:var(--fg3);font-size:14px}
.foot{font-size:12px;color:var(--fg3);margin:6px 8px 0;line-height:1.5}
.sw{width:51px;height:31px;border-radius:16px;background:#e3e3e8;position:relative;border:0;flex:none;transition:.2s}
.dark .sw{background:#39393d}
.sw:after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s}
.sw.on{background:#34c759}.sw.on:after{left:22px}
.sw:disabled{opacity:.4}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:600;background:var(--accent);color:#fff}
.btn.sec2{background:var(--card);color:var(--accent)}
.btn:disabled{opacity:.4}
.lnk{border:0;background:none;color:var(--accent);font-size:14px}
.pill{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--line);color:var(--fg2);white-space:nowrap}
.pill.ok{background:rgba(31,181,122,.15);color:var(--ok)}.pill.bad{background:rgba(239,74,90,.14);color:var(--err)}.pill.w{background:rgba(240,160,32,.16);color:#c07a00}
.navb{display:flex;align-items:center;justify-content:space-between;padding:4px 14px;height:40px;font-size:16px}
.navb b{font-size:16px}
.chev{color:var(--fg3)}

/* 引导 */
.onb{flex:1;display:flex;flex-direction:column;padding:10px 24px 40px}
.onb .dots{display:flex;gap:6px;justify-content:center;margin:4px 0 18px}.onb .dots i{width:6px;height:6px;border-radius:3px;background:var(--line)}.onb .dots i.on{width:18px;background:var(--accent)}
.onb h1{font-size:26px;line-height:1.25;margin-bottom:8px}
.onb p{color:var(--fg2);font-size:15px;line-height:1.55}
.onb .fill{flex:1}
.onb .acts{display:flex;flex-direction:column;gap:10px}
.appicon{width:84px;height:84px;border-radius:20px;background:#171a2e;display:grid;place-items:center;margin:30px auto 22px;box-shadow:0 8px 24px rgba(40,30,120,.35)}
.step{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--card);border-radius:12px;margin-top:10px;font-size:15px}
.step .n{width:24px;height:24px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.step .n.ok{background:var(--ok);color:#fff}
.step small{display:block;color:var(--fg3);font-size:12.5px;line-height:1.45;margin-top:2px}

/* 宿主 App（示意，非真实 App） */
.host{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--scr)}
.hh{height:44px;display:flex;align-items:center;justify-content:center;position:relative;border-bottom:.5px solid var(--line);font-size:16px;flex:none}
.hh .bk{position:absolute;left:12px;color:var(--accent);font-size:24px}
.msgs{flex:1;overflow:auto;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.bub{max-width:76%;padding:7px 12px;border-radius:18px;font-size:15px;line-height:1.4;background:var(--card);align-self:flex-start;white-space:pre-wrap;word-break:break-all}
.bub.me{align-self:flex-end;background:var(--accent);color:#fff}
.inbar{display:flex;gap:8px;align-items:flex-end;padding:6px 10px;border-top:.5px solid var(--line);flex:none}
.field{flex:1;min-height:36px;max-height:96px;overflow:auto;border:1px solid var(--line);border-radius:18px;padding:7px 12px;font-size:15px;line-height:1.4;background:var(--card);white-space:pre-wrap;word-break:break-all}
.field .ph{color:var(--fg3)}
.field .live{color:var(--fg3);background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:3px}
.caret{display:inline-block;width:2px;height:18px;background:var(--accent);vertical-align:-3px;animation:blink 1s steps(1) infinite}
.send{width:34px;height:34px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:17px;flex:none}

/* 键盘扩展 */
.kb{flex:none;height:324px;background:var(--kb);display:flex;flex-direction:column;position:relative;padding-bottom:34px;color:var(--keyfg);user-select:none;-webkit-user-select:none;touch-action:none}
.kt{height:44px;display:flex;align-items:center;gap:6px;padding:0 4px 0 8px;flex:none}
.chip{border:0;background:var(--key2);color:var(--keyfg);border-radius:14px;padding:4px 10px;font-size:12.5px;display:flex;align-items:center;gap:5px;max-width:150px;white-space:nowrap;overflow:hidden}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--fg3);flex:none}.chip i.on{background:var(--ok)}
.kt .st{flex:1;text-align:center;font-size:12px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gear{border:0;background:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--fg2)}
.kbody{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 10px;position:relative}
.mic{width:76px;height:76px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(106,92,255,.35);position:relative;transition:.15s}
.mic:active{transform:scale(.95)}
.mic.outline{background:var(--key);color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.mic.recn{background:var(--rec);box-shadow:0 0 0 0 rgba(255,59,48,.5);animation:ring 1.4s infinite}
.mic.fin{background:var(--key);color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.mic.off{opacity:.35}
.mlbl{margin-top:9px;font-size:13px;color:var(--keyfg);font-weight:500}
.msub{margin-top:2px;font-size:11.5px;color:var(--fg2);text-align:center;max-width:290px;line-height:1.4}
.live-box{width:100%;background:var(--key);border-radius:10px;padding:8px 11px;font-size:15px;line-height:1.45;min-height:48px;max-height:76px;overflow:auto;margin-bottom:8px;word-break:break-all;color:var(--keyfg)}
.live-box .d{color:var(--fg2)}
.live-box.bad{color:var(--err);font-size:13.5px}
.wave{display:flex;align-items:center;gap:3px;height:22px;margin-bottom:8px}
.wave i{width:3px;border-radius:2px;background:var(--accent);transition:height .1s}
.krow{height:46px;display:flex;gap:6px;padding:0 4px 4px;flex:none}
.key{flex:1;border:0;border-radius:6px;background:var(--key);color:var(--keyfg);font-size:15px;box-shadow:0 1px 0 rgba(0,0,0,.25);display:grid;place-items:center}
.key.f{background:var(--key2);flex:none;width:46px}
.key.w{flex:3}
.key.act{flex:3;background:var(--grad);color:#fff;font-weight:600;font-size:13.5px}
.key.act.r{background:var(--rec)}.key.act.f2{background:var(--key);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.note{position:absolute;left:8px;right:8px;top:4px;z-index:3;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.4;display:flex;gap:8px;align-items:flex-start;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.note.err{background:#ffe9eb;color:#a3121f}.note.warn{background:#fff3dc;color:#7a4b00}.note.info{background:var(--card);color:var(--fg)}
.dark .note.err{background:#4a1a20;color:#ffb3ba}.dark .note.warn{background:#4a3410;color:#ffd99a}
.note .x{margin-left:auto;border:0;background:none;color:inherit;opacity:.6;font-size:15px;line-height:1}
.note .a{border:0;background:rgba(0,0,0,.08);color:inherit;border-radius:6px;padding:1px 8px;font-size:12px;white-space:nowrap}

/* 拼音全键盘 */
.tmic,.tkb{width:32px;height:32px;border-radius:50%;border:0;display:grid;place-items:center;flex:none}
.tmic{background:var(--grad);color:#fff;box-shadow:0 2px 8px rgba(106,92,255,.3)}
.tmic.outline{background:var(--key);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.tmic.off{opacity:.35}
.tkb{background:var(--key);color:var(--keyfg);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.kt.comp{display:grid;grid-template-columns:1fr 36px;grid-template-rows:16px 28px;gap:0 2px;padding:0 2px 0 10px;align-items:center}
.pyl{grid-column:1/3;font-size:12.5px;color:var(--fg2);white-space:nowrap;overflow:hidden;letter-spacing:.2px}
.pyl b{color:var(--keyfg);font-weight:500}
.cands{display:flex;gap:2px;overflow:hidden;align-items:center;min-width:0}
.cd{border:0;background:none;color:var(--keyfg);font-size:18px;padding:1px 9px;white-space:nowrap;border-radius:6px;flex:none}
.cd.first{color:var(--accent);font-weight:600}
.cd:active{background:var(--key2)}
.more{border:0;background:none;border-left:.5px solid var(--line);color:var(--fg2);font-size:15px;height:26px}
.tkeys{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;padding:0 3px 2px;position:relative}
.tr{display:flex;gap:5px;justify-content:center}
.tk{flex:1;max-width:33px;height:42px;border:0;border-radius:6px;background:var(--key);color:var(--keyfg);font-size:19px;box-shadow:0 1px 0 rgba(0,0,0,.25);display:grid;place-items:center;padding:0}
.tk:active{background:var(--key2)}
.tk.f{background:var(--key2);font-size:14px;max-width:none;flex:none}
.tk.f:active{background:var(--key)}
.tk.sp{flex:1;max-width:none;font-size:14px}
.tk.ent{background:var(--accent);color:#fff}
.tk.shift.on{background:var(--key);font-weight:700}
.tk:disabled{opacity:.4}
.lng{font-size:13px;letter-spacing:-.2px}.lng i{font-style:normal;opacity:.45;font-size:11px}
.cgrid{flex:1;min-height:0;display:flex;gap:6px;padding:4px 4px 6px}
.cgrid .all{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(4,1fr);align-content:start;background:var(--key);border-radius:8px}
.cgrid .all button{border:0;background:none;border-bottom:.5px solid var(--line);border-right:.5px solid var(--line);color:var(--keyfg);font-size:18px;height:44px;white-space:nowrap;overflow:hidden}
.cgrid .all button.first{color:var(--accent);font-weight:600}
.cgrid .all button.raw{font-size:14px;color:var(--fg2)}
.cgrid .side{width:58px;display:flex;flex-direction:column;gap:6px}
.cgrid .side .tk{max-width:none;width:100%;flex:1;font-size:14px}
.kb.cur .kt,.kb.cur .tk:not(.sp),.kb.cur .key:not(.sp),.kb.cur .kbody{opacity:.35}
.kb.cur .fl{opacity:.35}

/* 拼音九宫格 */
.t9{flex:1;min-height:0;display:grid;grid-template-columns:50px repeat(3,1fr) 50px;grid-template-rows:repeat(3,1fr) 42px;gap:6px;padding:2px 1px 2px}
.t9 .tk{max-width:none;height:auto}
.t9 .fl{grid-column:1;grid-row:1/4;background:var(--key2);border-radius:6px;overflow:auto;display:flex;flex-direction:column}
.t9 .fl.py{background:var(--key)}
.t9 .fl button{border:0;background:none;color:var(--keyfg);font-size:15px;min-height:34px;flex:none;border-bottom:.5px solid var(--line)}
.t9 .fl.py button{font-size:14px}
.t9 .fl button:first-child{font-weight:600}
.t9 .fl .emp{color:var(--fg3);text-align:center;padding-top:10px}
.t9 .d{display:flex;flex-direction:column;align-items:center;line-height:1.15;font-size:16px}
.t9 .d small{font-size:10px;color:var(--fg2)}
.t9 .bot{grid-column:1/6;display:flex;gap:5px}
.t9 .bot .tk{height:100%}
.lay{display:flex;background:var(--key2);border-radius:8px;padding:2px;flex:none}
.lay button{border:0;background:none;color:var(--fg2);font-size:11.5px;padding:3px 6px;border-radius:6px}
.lay button.on{background:var(--key);color:var(--keyfg);font-weight:600}
.pyl u{text-decoration:none;color:var(--accent)}
.ctip{position:absolute;z-index:8;width:96px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:13px;color:#fff;background:rgba(30,30,40,.9);pointer-events:none}
.ctip.armed{background:var(--err)}

/* 键盘内候选面板 */
.pick{width:100%;flex:1;min-height:0;background:var(--key);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;margin:2px 0 6px}
.ph2{display:flex;align-items:center;gap:8px;padding:6px 8px 5px 11px;font-size:12px;color:var(--fg2);border-bottom:.5px solid var(--line)}
.ph2 .rd{width:7px;height:7px;border-radius:50%;background:var(--rec);animation:pulse 1.2s infinite}
.ph2 .sp{flex:1}
.ph2 .cl{width:26px;height:26px;border:0;border-radius:7px;background:var(--line);display:grid;place-items:center;color:var(--fg2);font-size:14px}
.prs{flex:1;overflow:auto}
.pr{display:flex;gap:8px;align-items:flex-start;padding:7px 10px 7px 11px;position:relative;cursor:pointer}
.pr+.pr{border-top:.5px solid var(--line)}
.pr.sel{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.pr.sel:before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:0 2px 2px 0;background:var(--accent)}
.pr .nm{width:56px;flex:none;font-size:11.5px;color:var(--fg2);display:flex;align-items:center;gap:4px;margin-top:2px;white-space:nowrap;overflow:hidden}
.sd{width:6px;height:6px;border-radius:50%;flex:none;background:var(--fg3)}
.sd.listen{background:var(--rec)}.sd.wait{background:var(--warn)}.sd.final{background:var(--ok)}.sd.error{background:var(--err)}
.pr .tx{flex:1;font-size:14.5px;line-height:1.4;word-break:break-all;color:var(--keyfg)}
.pr .tx.m{color:var(--fg3);font-size:13px}.pr .tx.bad{color:var(--err);font-size:13px}
.pr .ms{font-size:11px;color:var(--fg3);min-width:34px;text-align:right;margin-top:3px;font-variant-numeric:tabular-nums}
.pend{font-size:10.5px;color:var(--accent);display:block}

.sheet{position:absolute;inset:0;background:var(--kb);z-index:6;display:flex;flex-direction:column;padding:6px 8px 40px}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 6px;font-size:14px;font-weight:600}
.sheet .grp{background:var(--key)}
.chk{color:var(--accent);font-weight:700;width:18px;text-align:center}

.syskb{flex:1;display:flex;flex-direction:column;gap:7px;padding:8px 4px 0}
.syskb .rw{display:flex;gap:5px;justify-content:center}
.syskb .rw span{flex:1;max-width:33px;height:42px;border-radius:6px;background:var(--key);box-shadow:0 1px 0 rgba(0,0,0,.25);display:grid;place-items:center;font-size:17px}
.sysmark{font-size:11px;color:var(--fg2);text-align:center}

/* 主 App */
.tabs{height:82px;flex:none;display:flex;border-top:.5px solid var(--line);background:color-mix(in srgb,var(--card) 92%,transparent);padding-bottom:28px}
.tabs button{flex:1;border:0;background:none;color:var(--fg3);font-size:10.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--accent)}
.hero{border-radius:16px;padding:16px;background:var(--card);display:flex;flex-direction:column;gap:10px}
.hero .top{display:flex;align-items:center;gap:12px}
.hero .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--fg2);flex:none}
.hero.on .ic{background:var(--grad);color:#fff}
.hero b{font-size:18px;display:block}.hero small{font-size:13px;color:var(--fg2)}
.banner{border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.45;margin-bottom:10px;background:color-mix(in srgb,var(--accent) 13%,var(--card));display:flex;gap:8px}
.banner.err{background:color-mix(in srgb,var(--err) 13%,var(--card))}
.seg2{display:flex;background:var(--line);border-radius:8px;padding:2px}
.seg2 button{flex:1;border:0;background:none;padding:5px 0;font-size:13px;border-radius:6px}
.seg2 button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.cname{display:flex;align-items:center;gap:6px}
.edit{border:0;background:none;color:var(--fg3);font-size:13px}
.radio{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--fg3);flex:none;display:grid;place-items:center;background:none}
.radio.on{border-color:var(--accent)}.radio.on:after{content:"";width:12px;height:12px;border-radius:50%;background:var(--accent)}

/* 系统界面模拟 */
.alert{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:20;display:grid;place-items:center}
.alert .box{width:270px;border-radius:14px;background:color-mix(in srgb,var(--card) 96%,#888);text-align:center;overflow:hidden}
.alert .box .c{padding:18px 16px 14px}
.alert b{display:block;font-size:16px;margin-bottom:4px}.alert p{font-size:13px;line-height:1.4}
.alert .bs{display:flex;border-top:.5px solid var(--line)}
.alert .bs button{flex:1;border:0;background:none;padding:11px;font-size:16px;color:#0a84ff}
.alert .bs button+button{border-left:.5px solid var(--line);font-weight:600}
.switching{flex:1;display:grid;place-items:center;background:var(--scr)}
.switching .appicon{animation:pop .5s ease}
.toast{position:absolute;left:50%;top:60px;transform:translateX(-50%);background:rgba(30,30,40,.9);color:#fff;padding:7px 14px;border-radius:16px;font-size:13px;z-index:30;white-space:nowrap}
.tag{font-size:10px;padding:0 5px;border-radius:4px;background:#f0a02033;color:#b06e00;margin-left:4px;vertical-align:1px;white-space:nowrap}

/* 右侧说明 */
.notes{width:400px;flex:none;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:14px;padding:14px 16px;border:1px solid var(--line)}
.card h4{font-size:14px;margin-bottom:6px}
.card .k{font-size:11.5px;color:var(--fg3);margin-top:8px}
.card ul{padding-left:16px;font-size:12.5px;color:var(--fg2);line-height:1.6}
.card p{font-size:12.5px;color:var(--fg2)}
.rules{width:100%;border-collapse:collapse;font-size:12.5px}
.rules td,.rules th{border-top:1px solid var(--line);padding:5px 4px;text-align:left;vertical-align:top}
.rules th{color:var(--fg3);font-weight:500;border-top:0}
.rules tr.cur td{background:color-mix(in srgb,var(--accent) 12%,transparent)}

@keyframes pulse{50%{opacity:.35}}
@keyframes blink{50%{opacity:0}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,59,48,.45)}100%{box-shadow:0 0 0 16px rgba(255,59,48,0)}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:12px;height:12px;border:2px solid var(--fg3);border-top-color:transparent;border-radius:50%;display:inline-block;animation:spin .8s linear infinite;vertical-align:-2px}
@media (max-width:900px){.wrap{flex-direction:column;align-items:center}.notes{width:390px}}

<script>

const TABI={sess:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',ch:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>',set:GEAR.replace('width="19" height="19"','')};

// 示例识别结果：每段话在不同渠道的结果略有差异，用于演示候选对比
const SEGS=[
  ['明天下午三点在三楼会议室开会，','明天下午3点在3楼会议室开会。','明天下午三点再三楼会议室开会','明天下午三点，在三楼会议室开会。'],
  ['记得带上周的数据报表。','记得带上周的数据报表','记得带上州的数据报表。','记得带上上周的数据报表。'],
  ['会后我把纪要发群里。','会后我把纪要发群里','会后我把记要发群里。','会后我把纪要发到群里。']];
const LAT=[640,960,1420,820], RATE=[.85,.7,.55,.75];

const init=()=>({
  scr:'onb', onb:0, sysFrom:null, sysPage:'root', alert:null,
  perm:{kbd:false,full:false,mic:null},
  sess:{on:false,t0:0,last:0}, idleMin:10, autoStart:false,
  ch:[{n:'微信',on:true},{n:'千问',on:true},{n:'讯飞',on:true},{n:'百度',on:false}],
  multi:true, def:0, lastPick:0,
  kb:'idle', rows:[], seg:0, tok:0, sel:0, pend:null, recT:0, level:0,
  notice:null, sheet:false, sysKb:false, justOpened:false, from:false,
  sim:{net:false,mic:false}, host:'', cpos:0, msgs:[{t:'下午开会的时间地点定了吗？'}], recent:[], tab:'sess', toast:null, tests:{},
  // 打字：mode 键盘当前是打字还是语音；voiceFrom 记住从打字进入语音，说完回打字
  mode:'type', voiceFrom:null, openMode:'type', lastMode:'type',
  lang:'zh', py:'', picks:[], page:'abc', shift:false, more:false, recentSheet:false, cursor:false, clr:null,
  // 九宫格：layout 中文布局；t9.sel 左列已筛定的拼音，t9.d 还没筛的数字串（' 为分词）；t9p 1 键符号序列当前项
  layout:'26', t9:{sel:[],d:''}, t9p:null

let S=init(), timer=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const on=()=>S.ch.map((c,i)=>({...c,i})).filter(c=>c.on);
const isMulti=()=>S.multi&&on().length>=2;
const mmss=ms=>{const s=Math.max(0,Math.floor(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function toast(t){S.toast=t;clearTimeout(toast.h);toast.h=setTimeout(()=>{S.toast=null;render()},1600)}

/* 原型词库，不是生产拼音引擎；候选/分词/频率均仅作交互示意 */
const PY={
  nihao:['你好','你号','拟好'],ni:['你','尼','泥','妮','拟','逆','腻','倪','霓'],hao:['好','号','浩','毫','豪','耗','皓','昊'],
  mingtian:['明天'],ming:['明','名','命','鸣','铭'],tian:['天','田','填','甜','添'],
  xiawu:['下午'],xia:['下','夏','吓','霞','虾','侠'],wu:['五','无','吴','物','午','舞','误','屋','武'],
  kaihui:['开会'],kai:['开','凯','楷','恺'],hui:['会','回','灰','汇','挥','慧','惠','辉'],
  women:['我们'],wo:['我','握','窝','卧'],men:['们','门','闷'],
  xiexie:['谢谢'],xie:['谢','写','些','鞋','协','携'],shoudao:['收到'],shou:['收','手','首','受','守','瘦'],dao:['到','道','倒','刀','导','岛'],
  shijian:['时间','实践','事件'],shi:['是','时','事','十','使','市','师','诗','世','式','试','石','史','识','室','视','士','实','食','始','适','示','势','施','湿','失','释','拾'],jian:['见','件','间','建','简','检','坚','箭'],
  zai:['在','再','载','灾'],san:['三','散','伞'],dian:['点','电','店','典','颠'],
  huilai:['回来'],lai:['来','赖','莱'],huiyishi:['会议室'],yi:['一','以','已','意','衣','亿','依','宜','易','义','亦','忆','艺','议'],
  keyi:['可以'],ke:['可','科','课','客','颗','克','刻'],meiwenti:['没问题'],mei:['没','每','美','妹','梅','枚'],wen:['问','文','闻','温','稳'],ti:['题','提','体','替','踢'],
  zhongwen:['中文'],zhong:['中','种','重','钟','终','众'],pinyin:['拼音'],pin:['拼','品','频','贫'],yin:['音','因','引','银','印','饮','隐'],
  haode:['好的'],de:['的','得','地'],shuru:['输入'],shu:['书','数','输','树','属','术','熟','舒'],ru:['入','如','乳'],
  zaijian:['再见'],zaoshang:['早上'],zao:['早','造','枣','澡'],shang:['上','商','伤','赏'],
  wang:['王','网','往','望','忘'],zhen:['真','镇','针','阵','震'],hen:['很','狠','恨'],dui:['对','队','堆'],bu:['不','部','步','布','补'],le:['了','乐'],
  ai:['爱','哎','艾','矮'],en:['嗯','恩'],o:['哦','噢'],a:['啊','阿'],ba:['吧','八','把','爸'],ma:['吗','妈','马','嘛'],
  beijing:['北京'],bei:['北','被','倍','杯'],jing:['京','经','精','景','静'],shanghai:['上海'],hai:['海','还','孩'],
  pengyou:['朋友'],peng:['朋','鹏','碰','捧'],you:['有','又','由','友','优','游','油'],
  qing:['请','清','情','轻','青'],fa:['发','法','罚'],gei:['给'],qun:['群','裙'],li:['里','理','李','力','立','利','离'],
  lv:['绿','旅','吕','律','率'],lve:['略','掠'],mi:['米','密','迷','蜜','秘','觅']
};
const SYLL=new Set(('a ai an ang ao ba bai ban bang bao bei ben beng bi bian biao bie bin bing bo bu ca cai can cang cao ce cen ceng cha chai chan chang chao che chen cheng chi chong chou chu chua chuai chuan chuang chui chun chuo ci cong cou cu cuan cui cun cuo da dai dan dang dao de dei den deng di dia dian diao die ding diu dong dou du duan dui dun duo e ei en eng er fa fan fang fei fen feng fo fou fu ga gai gan gang gao ge gei gen geng gong gou gu gua guai guan guang gui gun guo ha hai han hang hao he hei hen heng hong hou hu hua huai huan huang hui hun huo ji jia jian jiang jiao jie jin jing jiong jiu ju juan jue jun ka kai kan kang kao ke ken keng kong kou ku kua kuai kuan kuang kui kun kuo la lai lan lang lao le lei leng li lia lian liang liao lie lin ling liu long lou lu luan lun luo lv lve ma mai man mang mao me mei men meng mi mian miao mie min ming miu mo mou mu na nai nan nang nao ne nei nen neng ni nian niang niao nie nin ning niu nong nou nu nuan nuo nv nve o ou pa pai pan pang pao pei pen peng pi pian piao pie pin ping po pou pu qi qia qian qiang qiao qie qin qing qiong qiu qu quan que qun ran rang rao re ren reng ri rong rou ru ruan rui run ruo sa sai san sang sao se sen seng sha shai shan shang shao she shei shen sheng shi shou shu shua shuai shuan shuang shui shun shuo si song sou su suan sui sun suo ta tai tan tang tao te teng ti tian tiao tie ting tong tou tu tuan tui tun tuo wa wai wan wang wei wen weng wo wu xi xia xian xiang xiao xie xin xing xiong xiu xu xuan xue xun ya yan yang yao ye yi yin ying yo yong you yu yuan yue yun za zai zan zang zao ze zei zen zeng zha zhai zhan zhang zhao zhe zhei zhen zheng zhi zhong zhou zhu zhua zhuai zhuan zhuang zhui zhun zhuo zi zong zou zu zuan zui zun zuo').split(' '));
function syllables(s){
  const out=[];let i=0;
  while(i<s.length){if(s[i]==="'"){i++;continue}let n=Math.min(6,s.length-i);while(n>1&&!SYLL.has(s.slice(i,i+n)))n--;out.push(s.slice(i,i+n));i+=n}
  return out;
}
function candidates(){
  if(S.t9p!=null)return T9P.map((_,k)=>({t:T9P[(k+S.t9p)%T9P.length]}));
  if(t9has())return t9Cands();
  if(!S.py)return [];
  const flat=S.py.replaceAll("'",''), parts=syllables(S.py),out=[];
  // 整词优先，然后前半句；选前半句后剩余拼音继续选。
  for(let n=parts.length;n>0;n--){const k=parts.slice(0,n).join('');if(PY[k]){
    let use=0,used=0;while(use<S.py.length&&used<k.length){if(S.py[use]!=="'")used++;use++}
    PY[k].forEach(t=>{if(!out.some(x=>x.t===t))out.push({t,use})});
  }}
  if(!out.length&&flat.length>=2){Object.keys(PY).filter(k=>k.startsWith(flat)).slice(0,5).forEach(k=>out.push({t:PY[k][0],use:S.py.length}))}
  out.push({t:S.py,use:S.py.length,raw:true});return out;
}

/* 九宫格：同一示例词库按数字匹配，模拟 librime + 雾凇 t9；筛选列真实来源是候选的拼音注释 */
const K9={2:'abc',3:'def',4:'ghi',5:'jkl',6:'mno',7:'pqrs',8:'tuv',9:'wxyz'},L9={};
Object.entries(K9).forEach(([d,s])=>[...s].forEach(c=>L9[c]=d));
const code9=p=>[...p].map(c=>L9[c]).join('');
const S9={};SYLL.forEach(s=>(S9[code9(s)]||(S9[code9(s)]=[])).push(s));
const T9P=['@','.','/',':','_','-','#','1'];
const T9L=['，','。','？','！','、','：','；','…','～','“','”'];
const T9N=['+','-','*','/','=','%','@',':','(',')','#','~'];
const pys=k=>(pys.c||(pys.c={}))[k]||(pys.c[k]=syllables(k));
const t9on=()=>S.layout==='t9'&&S.lang==='zh';
const t9has=()=>S.t9.d.length>0||S.t9.sel.length>0;
function m9(parts,sel,d){
  let j=0;
  for(;j<sel.length&&j<parts.length;j++){const s=sel[j],p=parts[j];if(!(p===s||(s.length===1&&p[0]===s)))return null}
  if(parts.length<=sel.length)return {n:parts.length,i:0,ab:0,pt:0,disp:[]};
  let i=0,ab=0,pt=0;const disp=[];
  for(;j<parts.length;j++){
    if(d[i]==="'")i++;
    if(i>=d.length)return null;
    const p=parts[j],c=code9(p),rest=d.slice(i);
    if(rest.startsWith(c)){i+=c.length;disp.push(p)}
    else if(j===parts.length-1&&!rest.includes("'")&&c.startsWith(rest)){disp.push(p.slice(0,rest.length));i=d.length;pt=1}
    else if(c[0]===d[i]){i++;ab++;disp.push(p[0])}
    else return null;
  }
  return {n:sel.length,i,ab,pt,disp};
}
function t9Guess(d){
  const out=[];let g=0;
  while(d&&g++<30){
    if(d[0]==="'"){d=d.slice(1);continue}
    let best=null;
    for(const k in PY){const m=m9(pys(k),[],d);if(m&&(!best||m.i>best.i||(m.i===best.i&&m.pt+m.ab<best.pt+best.ab)))best=m}
    if(best){out.push(...best.disp);d=d.slice(best.i)}else{out.push(K9[d[0]][0]);d=d.slice(1)}
  }
  return out;
}
const t9Pre=()=>[...S.t9.sel,...t9Guess(S.t9.d)].join("'");
function t9Cands(){
  const {sel,d}=S.t9,out=[];
  Object.keys(PY).forEach((k,ki)=>{const m=m9(pys(k),sel,d);if(!m||(!m.n&&!m.i))return;
    const cov=m.n<sel.length?m.n:100+m.i;
    PY[k].forEach((t,wi)=>out.push({t,n:m.n,i:m.i,py:m.disp,s:[-cov,m.pt,m.ab,ki,wi]}))});
  out.sort((a,b)=>{for(let x=0;x<5;x++)if(a.s[x]!==b.s[x])return a.s[x]-b.s[x];return 0});
  const seen=new Set(),res=out.filter(c=>!seen.has(c.t)&&seen.add(c.t));
  res.push({t:t9Pre().replaceAll("'",''),n:sel.length,i:d.length,raw:true});
  return res;
}
function t9Filters(){
  const seg=S.t9.d.replace(/^'+/,'').split("'")[0];if(!seg)return [];
  const out=[],add=p=>{if(p&&!out.includes(p))out.push(p)};
  t9Cands().forEach(c=>{const p=c.py&&c.py[0];if(!c.raw&&c.n===S.t9.sel.length&&SYLL.has(p)&&seg.startsWith(code9(p)))add(p)});
  for(let k=Math.min(6,seg.length);k>0;k--)(S9[seg.slice(0,k)]||[]).forEach(add);
  [...K9[seg[0]]].forEach(add);
  return out;
}
function t9Pick(p){const t=S.t9;t.d=t.d.replace(/^'+/,'').slice(code9(p).length).replace(/^'+/,'');t.sel.push(p);S.more=false}
function t9Key(n){if(S.t9p!=null)choose(0);S.t9.d+=n;S.more=false}
function t9One(){
  if(t9has()){if(S.t9.d&&!S.t9.d.endsWith("'"))S.t9.d+="'";return}
  if(S.t9p!=null){S.t9p=(S.t9p+1)%T9P.length;return}
  if(!composing())S.t9p=0;
}
const composing=()=>S.py.length>0||S.picks.length>0||t9has()||S.t9p!=null;
const compRaw=()=>S.picks.map(x=>x.t).join('')+(S.t9p!=null?T9P[S.t9p]:S.py||(t9has()?t9Pre().replaceAll("'",''):''));
const insert=t=>{const a=[...S.host];S.cpos=Math.min(S.cpos,a.length);a.splice(S.cpos,0,...t);S.host=a.join('');S.cpos+=[...t].length};
function delBack(){if(composing())return compBack();const a=[...S.host];if(S.cpos>0){a.splice(--S.cpos,1);S.host=a.join('')}}
function clearComp(){S.py='';S.picks=[];S.t9={sel:[],d:''};S.t9p=null;S.more=false}
function compBack(){
  if(S.t9p!=null)S.t9p=null;
  else if(S.py)S.py=S.py.slice(0,-1);
  else if(S.t9.d)S.t9.d=S.t9.d.slice(0,-1);
  else if(S.t9.sel.length)S.t9.d=code9(S.t9.sel.pop());
  else if(S.picks.length){const p=S.picks.pop();if(p.t9)S.t9={sel:[...p.t9.sel],d:p.t9.d};else S.py=p.py}
  if(!composing())S.more=false;
}
function choose(i){const c=candidates()[i];if(!c)return;
  if(S.t9p!=null){insert(c.t);clearComp();return}
  if(t9has()){const t=S.t9;
    S.picks.push({t:c.t,t9:{sel:t.sel.slice(0,c.n),d:c.n<t.sel.length?'':t.d.slice(0,c.i)}});
    if(c.n<t.sel.length)t.sel=t.sel.slice(c.n);else{t.sel=[];t.d=t.d.slice(c.i).replace(/^'+/,'')}
    if(!t9has()){insert(S.picks.map(x=>x.t).join(''));clearComp()}
    return;

/* ---------- 听写状态机（沿用桌面规则） ---------- */
const target=r=>SEGS[S.seg%SEGS.length][r.ci%4];
function startNew(){
  const chs=isMulti()?on():[on().find(c=>c.i===S.def)||on()[0]];
  S.rows=chs.map(c=>({ci:c.i,done:'',cur:'',st:'listen',ms:null}));
  S.seg=0;S.pend=null;
  const k=S.rows.findIndex(r=>r.ci===S.lastPick);S.sel=k<0?0:k;
  rec();
}
function rec(){
  S.kb='rec';S.recT=Date.now();S.tok++;S.sess.last=Date.now();S.notice=null;
  clearInterval(timer);
  timer=setInterval(()=>{
    for(const r of S.rows) if(r.st==='listen'){const t=target(r);if(r.cur.length<t.length&&Math.random()<RATE[r.ci%4])r.cur=t.slice(0,r.cur.length+1)}
    S.level=Math.random();if(!hold)render();
  },120);
}
function stop(){
  clearInterval(timer);S.kb='fin';const tok=S.tok;
  S.rows.forEach(r=>{if(r.st==='listen'){r.st='wait';fin(r,tok)}});
}
function fin(r,tok){
  const lat=LAT[r.ci%4]+Math.round(Math.random()*200);
  setTimeout(()=>{
    if(tok!==S.tok||S.kb==='idle')return;
    const bad=S.sim.net&&(S.rows.length===1||r.ci===1);
    if(bad){r.st='error';r.cur=''}else{r.cur=target(r);r.st='final'}
    r.ms=lat;settle();render();
  },lat);
}
function settle(){
  if(S.kb==='rec')return;
  const all=S.rows.every(r=>r.st==='final'||r.st==='error');
  if(!isMulti()){
    const r=S.rows[0];
    if(r.st==='final')return commit(r);
    if(r.st==='error')S.kb='err';
    return;
  }
  const s=S.rows[S.sel];
  if(s&&s.st==='error'){const k=S.rows.findIndex(x=>x.st==='final');if(k>=0)S.sel=k;
    if(S.pend!=null){S.pend=null;S.notice={kind:'err',text:'你选的渠道识别失败，已改选其他渠道，请再点一次确认。'}}}
  if(S.pend!=null&&S.rows[S.pend]&&S.rows[S.pend].st==='final')return commit(S.rows[S.pend]);
  if(all)S.kb='done';
}
function cont(){ // 识别中或候选框打开时：接着说，拼在原句后
  S.tok++;
  for(const r of S.rows){r.done+=(r.st==='error'?'':target(r));r.cur='';r.st='listen';r.ms=null}
  S.seg++;S.pend=null;rec();
}
function commit(r){
  const text=r.done+r.cur;
  insert(text);S.lastPick=r.ci;S.recent.unshift({text,ch:S.ch[r.ci].n,at:new Date().toTimeString().slice(0,5)});S.recent=S.recent.slice(0,20);
  reset();toast('已上屏 · '+S.ch[r.ci].n);
}
function reset(){clearInterval(timer);S.tok++;S.kb='idle';S.rows=[];S.pend=null;S.seg=0;if(S.voiceFrom==='type'){setMode('type');S.voiceFrom=null}}
function retry(){const tok=S.tok;S.rows.forEach(r=>{if(r.st==='error'){r.st='wait';fin(r,tok)}});S.kb='fin';S.notice=null}
function tapMic(){
  if(!S.perm.full){S.notice={kind:'err',text:'未开启「允许完全访问」，键盘无法与 VoiceKey 主 App 通信。',act:['去设置','gosys']};return}
  if(!S.sess.on)return openSession();
  S.sess.last=Date.now();
  if(S.kb==='idle'){if(S.sim.mic){S.notice={kind:'err',text:'麦克风被占用：可能正在通话或其他 App 在录音，结束后再试。'};return}startNew()}
  else if(S.kb==='rec')stop();
  else if(S.kb==='fin'||S.kb==='done')cont();
  else if(S.kb==='err'){const from=S.voiceFrom;reset();S.voiceFrom=from;setMode('voice');startNew()}
}
function pick(i){
  S.sel=i;const r=S.rows[i];
  if(r.st==='error'){S.notice={kind:'err',text:S.ch[r.ci].n+' 没有结果，请选其他渠道或重试。'};return}
  if(S.kb==='rec')stop();
  if(r.st==='final'&&S.kb!=='rec')return commit(r);
  S.pend=i;toast('定稿后上屏');
}
function openSession(){

  }

  return `<div class="kb ${S.cursor?'cur':''}">${top}${S.mode==='type'?(S.more?allCandidates():typeKeys(note)):`<div class="kbody">${note}${body}</div>${bottom}`}${sheet}${history}${tip}</div>`;
}

function render(){

function nkey(){
  if(S.scr==='onb')return 'onb'+S.onb;
  if(S.scr==='sys'||S.scr==='switch')return S.scr;
  if(S.scr==='app')return 'app_'+S.tab;
  if(S.sysKb)return 'kb_sys';
  if(S.mode==='type'){const t9=t9on();if(S.more)return 'kb_more';if(composing())return S.t9p!=null?'kb_t9p':t9&&S.page==='abc'?'kb_t9py':'kb_py';if(S.page!=='abc')return t9&&S.page==='num'?'kb_t9num':'kb_num';return S.lang==='zh'?(t9?'kb_t9':'kb_type'):'kb_en'}
  if(!S.perm.full)return 'kb_full';
  if(!S.sess.on&&S.kb==='idle')return 'kb_nosess';
  if(S.kb==='idle')return 'kb_idle';
  if(isMulti())return 'kb_pick_'+(S.kb==='rec'?'rec':S.kb==='fin'?'fin':'done');
  return 'kb_'+S.kb;
}

  <div class="card"><h4>打字 / 语音共存（建议）</h4><ul><li>默认打字；空闲工具栏左侧固定麦克风，语音面板同一位置是 ⌨ 返回打字。用明示按钮，不靠隐藏滑动手势。</li><li>语音就绪时点一下直接说；首次跳主 App → 系统「◀」返回 → 再点说。上屏后回打字；多渠道须选结果后才回。</li><li>聆听 / 定稿 / 待选结果时不让 ⌨ / 🌐 偷偷丢内容，提示先结束或关闭本句；✕ 丢弃后回打字。</li><li>顶部保留渠道、最近、设置；敲拼音时让位于候选栏。最近只收语音上屏和「已清空」，不记录每个打字词。</li><li>九宫格与 26 键只换按键区：语音面板、多渠道候选框仍整块替换按键区；⌨ 返回时回到当前布局。组字中 ⌫ 只删拼音、长按空格不移光标，两种布局一致。</li><li>长按空格保留移光标；不学豆包的空格按住说话，避免手势冲突。上滑清空先存最近，没完全访问时不提供正文清空。</li></ul></div>

    if(a==='full'){S.perm.full=!S.perm.full;if(!S.perm.full)reset();S.notice=null;return}
    if(!S.sess.on){S.sess={on:true,t0:Date.now(),last:Date.now()}}
    if(a==='warn'){S.notice={kind:'warn',text:'会话 0:30 后结束 · 现在说话会自动续期'}}
    if(a==='expire'){reset();S.sess.on=false;S.notice={kind:'info',text:`会话已结束（${S.idleMin||10} 分钟未使用）。点麦克风会重新开启。`}}
  },
};

/* 手势用窗口级监听，录音/计时重新渲染也不会丢掉拖动状态。 */
let hold=null,holdClickUntil=0;
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest('[data-hold]');if(!el)return;
  e.preventDefault();
  const k=document.querySelector('.kb').getBoundingClientRect(),r=el.getBoundingClientRect(),z=k.width/368;
  hold={id:e.pointerId,kind:el.dataset.hold,x:e.clientX,y:e.clientY,z,cur:S.cpos,comp:composing(),moved:false,armed:false,
    tip:{x:Math.min(264,Math.max(4,(r.left-k.left+r.width/2)/z-48)),y:(r.top-k.top)/z-38}};
  if(hold.kind==='space'){
    if(hold.comp)return;
    hold.t=setTimeout(()=>{if(!hold)return;S.cursor=true;render()},300);
  }else{
    delBack();render();
    hold.t=setTimeout(()=>{if(!hold)return;S.clr={...hold.tip,armed:false};hold.rep=setInterval(()=>{if(hold&&!hold.moved){delBack();render()}},80);render()},450);
  }
});
addEventListener('pointermove',e=>{
  if(!hold||e.pointerId!==hold.id)return;
  if(hold.kind==='space'&&S.cursor){S.cpos=Math.max(0,Math.min([...S.host].length,hold.cur+Math.round((e.clientX-hold.x)/(12*hold.z))));render()}
  if(hold.kind==='bs'&&!hold.comp&&e.clientY<hold.y-15*hold.z){hold.moved=true;clearInterval(hold.rep)}
  if(hold.kind==='bs'&&e.clientY<hold.y-15*hold.z){
    hold.moved=true;clearInterval(hold.rep);hold.armed=e.clientY<hold.y-48*hold.z;
    S.clr={...hold.tip,armed:hold.armed};render();
  }else if(hold.kind==='bs'&&hold.moved){hold.armed=false;if(S.clr)S.clr.armed=false;render()}
});
function releaseHold(e){
  if(!hold||e.pointerId!==hold.id)return;
  clearTimeout(hold.t);clearInterval(hold.rep);
  if(e.type==='pointerup'){
    if(hold.kind==='space'&&!S.cursor)space();
    if(hold.kind==='bs'&&hold.armed){if(hold.comp){clearComp();toast('已清除拼音')}else clearInput()}
  }
  holdClickUntil=Date.now()+350;hold=null;S.cursor=false;S.clr=null;render();
}
addEventListener('pointerup',releaseHold);addEventListener('pointercancel',releaseHold);
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  if(el.dataset.hold&&Date.now()<holdClickUntil)return;
  const f=ACT[el.dataset.act];if(!f)return;
  e.stopPropagation();f(el.dataset.a);render();
});
setInterval(()=>{if(!hold&&S.sess.on&&S.scr==='app'&&S.tab==='sess')render()},1000);
function fit(){const h=innerHeight-$('tb').offsetHeight-44;document.querySelector('.phone').style.zoom=Math.min(1,h/866)}
addEventListener('resize',fit);
render();fit();
</script>
</body>
