name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || VER="0.0.0-dev"
          VERSION="$VER" BUILD="$GITHUB_RUN_NUMBER" SIGN_IDENTITY=- ./build.sh
          ./Scripts/dmg.sh "VoiceKey-$VER.dmg"
          echo "DMG=VoiceKey-$VER.dmg" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceKey
          path: ${{ env.DMG }}

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$DMG" --title "VoiceKey $GITHUB_REF_NAME" --generate-notes \
            --notes "未经 Apple 公证（ad-hoc 签名）。打开 DMG 将 VoiceKey 拖到「应用程序」后，首次运行前在终端执行：\`xattr -dr com.apple.quarantine /Applications/VoiceKey.app\`"
