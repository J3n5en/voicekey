name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: universal-apple-darwin
            rust: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Version
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || VER="0.0.0"
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Build
        working-directory: app
        run: |
          npm ci
          npx tauri build --target ${{ matrix.target }} --config "{\"version\":\"$VER\"}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          Scripts/dmg.sh "dist/VoiceKey-$VER.dmg" target/universal-apple-darwin/release/bundle/macos/VoiceKey.app app/src-tauri/icons/icon.icns

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist
          B=target/x86_64-pc-windows-msvc/release/bundle
          cp $B/nsis/*-setup.exe "dist/VoiceKey-$VER-x64-setup.exe"
          cp $B/msi/*.msi "dist/VoiceKey-$VER-x64.msi"

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceKey-${{ runner.os }}
          path: dist/*

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "VoiceKey $GITHUB_REF_NAME" --generate-notes \
            --notes "macOS 包未经 Apple 公证（ad-hoc 签名）：打开 DMG 将 VoiceKey 拖到「应用程序」后，首次运行前在终端执行 \`xattr -dr com.apple.quarantine /Applications/VoiceKey.app\`。Windows 提供安装程序（setup.exe）与 MSI 两种格式。"
